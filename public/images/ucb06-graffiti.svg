<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title">
<title id="title">UCB06 graffiti spray-paint lettering</title>
<defs>
  <filter id="spray" x="-15%" y="-25%" width="130%" height="150%">
    <feTurbulence type="fractalNoise" baseFrequency=".035 .09" numOctaves="2" seed="18" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough" x="-25%" y="-30%" width="150%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency=".12" numOctaves="2" seed="9" result="grain"/>
    <feDisplacementMap in="SourceGraphic" in2="grain" scale="3"/>
  </filter>
</defs>
<g transform="rotate(-5 600 210)">
  <text x="600" y="292" text-anchor="middle" font-family="'Permanent Marker','Impact',sans-serif" font-size="320" font-weight="900" letter-spacing="-18" fill="#111" stroke="#111" stroke-width="34" stroke-linejoin="round" paint-order="stroke" opacity=".95" filter="url(#rough)">UCB06</text>
  <text x="600" y="282" text-anchor="middle" font-family="'Permanent Marker','Impact',sans-serif" font-size="320" font-weight="900" letter-spacing="-18" fill="#c82027" stroke="#f0e7d7" stroke-width="9" stroke-linejoin="round" paint-order="stroke" filter="url(#spray)">UCB06</text>
  <text x="600" y="282" text-anchor="middle" font-family="'Permanent Marker','Impact',sans-serif" font-size="320" font-weight="900" letter-spacing="-18" fill="none" stroke="#8f171d" stroke-width="3" stroke-linejoin="round" filter="url(#rough)">UCB06</text>
  <path d="M215 315c-8 18-5 35-13 49m176-41c-4 17 1 27-7 42m348-40c-6 16-3 29-12 43m213-44c-2 18 3 28-4 40m118-51c-4 17 0 27-8 40" fill="none" stroke="#c82027" stroke-width="10" stroke-linecap="round" opacity=".9"/>
  <g fill="#c82027" opacity=".85">
    <circle cx="125" cy="114" r="7"/><circle cx="173" cy="88" r="4"/><circle cx="1010" cy="104" r="6"/><circle cx="1080" cy="145" r="4"/><circle cx="950" cy="345" r="5"/><circle cx="280" cy="355" r="4"/><circle cx="740" cy="78" r="5"/>
  </g>
  <g fill="#111" opacity=".75">
    <circle cx="150" cy="150" r="4"/><circle cx="1035" cy="78" r="4"/><circle cx="890" cy="355" r="3"/><circle cx="345" cy="78" r="3"/>
  </g>
